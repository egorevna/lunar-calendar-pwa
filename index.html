<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#061421">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Лунный календарь">
    <title>Лунный календарь</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app-shell" aria-label="Лунный календарь">
      <section class="home-screen">
        <section class="hero" aria-live="polite">
          <p class="date" data-date></p>
          <p class="weekday" data-weekday></p>
          <p class="clock" data-clock></p>
          <p class="lunar-day"><span data-lunar-day></span></p>
          <p class="phase" data-phase></p>
          <div class="moon-sign" aria-label="Знак Луны">
            <span data-moon-sign></span>
            <small data-next-moon-sign></small>
          </div>
        </section>

        <section class="info-stack">
          <article class="glass-card voc-card">
            <div class="planet-badge">☾</div>
            <div>
              <h2>Луна без курса</h2>
              <p data-voc></p>
              <small data-voc-aspect></small>
            </div>
            <button class="help-button" aria-label="Что такое Луна без курса?">?</button>
          </article>

          <article class="glass-card moon-aspects-card">
            <div class="card-heading">
              <h2>Аспекты Луны</h2>
              <button class="help-button" type="button" aria-label="Пояснить следующий аспект Луны" aria-expanded="false" data-moon-aspects-toggle>?</button>
            </div>
            <div class="aspect-row">
              <span>Последний аспект</span>
              <strong data-last-moon-aspect></strong>
            </div>
            <div class="aspect-row">
              <span>Следующий аспект</span>
              <strong data-next-moon-aspect></strong>
            </div>
            <p class="aspect-interpretation" data-moon-aspect-interpretation hidden></p>
          </article>

          <article class="glass-card indicators-card">
            <div class="indicator-heading">
              <span>Индикатор дня</span>
              <strong data-day-officer></strong>
            </div>
            <div class="indicator-row">
              <span>Лунные сутки</span>
              <strong data-lunar-symbol></strong>
            </div>
            <div class="indicator-row">
              <span>Ба-цзы</span>
              <strong data-sexagenary-day></strong>
            </div>
          </article>

          <article class="glass-card planetary-card">
            <div class="planet-row">
              <div class="planet-badge" data-day-glyph></div>
              <div class="planet-copy">
                <p class="label">Планетарный день</p>
                <h2 data-planetary-day></h2>
              </div>
              <button class="help-button" aria-label="Что такое планетарный день?">?</button>
            </div>
            <div class="divider"></div>
            <div class="planet-row">
              <div class="planet-badge" data-hour-glyph></div>
              <div class="planet-copy">
                <p class="label">Планетарный час</p>
                <h2 data-planetary-hour></h2>
              </div>
              <div class="hour-range">
                <strong data-hour-range></strong>
                <span>текущий час</span>
              </div>
            </div>
          </article>

          <article class="glass-card field-card">
            <p class="field-label">Качество поля</p>
            <h2 data-field-summary></h2>
            <div class="field-metrics" data-field-metrics></div>
            <div class="field-advice">
              <section>
                <h3>Подходит</h3>
                <ul data-field-supports></ul>
              </section>
              <section>
                <h3>Не подходит</h3>
                <ul data-field-avoid></ul>
              </section>
            </div>
            <p class="field-reasons-title">Почему так</p>
            <ul class="field-reasons" data-field-reasons></ul>
          </article>
        </section>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
