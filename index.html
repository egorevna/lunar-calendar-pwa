<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#061421">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Лунный календарь">
    <title>Лунный календарь</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app-shell" aria-label="Лунный календарь">
      <section class="home-screen">
        <header class="top-bar">
          <button class="icon-button" aria-label="Меню">
            <span></span><span></span><span></span>
          </button>
          <h1>Лунный календарь</h1>
          <button class="star-button" aria-label="Избранное">☆</button>
        </header>

        <section class="hero" aria-live="polite">
          <p class="date" data-date></p>
          <p class="weekday" data-weekday></p>
          <p class="clock" data-clock></p>
          <div class="moon-visual" data-moon>
            <div class="moon-surface"></div>
            <div class="moon-shadow"></div>
          </div>
          <p class="lunar-day"><span data-lunar-day></span> <button class="help-inline" aria-label="Что такое лунный день?">?</button></p>
          <p class="phase" data-phase></p>
          <div class="moon-sign" aria-label="Знак Луны">
            <span data-moon-sign></span>
            <small data-next-moon-sign></small>
          </div>
        </section>

        <section class="info-stack">
          <article class="glass-card voc-card">
            <div class="planet-badge">☾</div>
            <div>
              <h2>Луна без курса</h2>
              <p data-voc></p>
            </div>
            <button class="help-button" aria-label="Что такое Луна без курса?">?</button>
          </article>

          <article class="glass-card planetary-card">
            <div class="planet-row">
              <div class="planet-badge" data-day-glyph></div>
              <div class="planet-copy">
                <p class="label">Планетарный день</p>
                <h2 data-planetary-day></h2>
              </div>
              <button class="help-button" aria-label="Что такое планетарный день?">?</button>
            </div>
            <div class="divider"></div>
            <div class="planet-row">
              <div class="planet-badge" data-hour-glyph></div>
              <div class="planet-copy">
                <p class="label">Планетарный час</p>
                <h2 data-planetary-hour></h2>
              </div>
              <div class="hour-range">
                <strong data-hour-range></strong>
                <span>текущий час</span>
              </div>
            </div>
          </article>
        </section>

        <nav class="tab-bar" aria-label="Разделы">
          <button class="tab active" aria-current="page"><span>☾</span>Главная</button>
          <button class="tab"><span>▦</span>Календарь</button>
          <button class="tab"><span>♄</span>Планеты</button>
          <button class="tab"><span>ⓘ</span>Знания</button>
          <button class="tab"><span>⚙</span>Настройки</button>
        </nav>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
